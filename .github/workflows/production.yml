name: LaidbackHR production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: laidbackhr-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: Laidback.ai
  ACR_NAME: laidbackhrf61hno
  ACR_LOGIN_SERVER: laidbackhrf61hno.azurecr.io
  WEB_APP_NAME: laidbackhr-f61hno-web
  APP_KEY_VAULT: laidbackhr-f61hno-kv
  TERRAFORM_VERSION: 1.15.8
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laidbackhr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laidbackhr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate web application
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test:interactions
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/laidbackhr_test' DATABASE_SSL_MODE=disable pnpm test:operations
          pnpm test:knowledge
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm build:azure
      - name: Smoke test compiled application
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/laidbackhr_test
          DATABASE_SSL_MODE: disable
          LOCAL_UI_PREVIEW: "true"
          BOOTSTRAP_ADMIN_EMAIL: local-admin@laidbackhr.ai
          BOOTSTRAP_ADMIN_NAME: CI administrator
          APP_VERSION: ci-smoke
          PORT: "3000"
        run: |
          set -euo pipefail
          pnpm start > /tmp/laidbackhr-next.log 2>&1 &
          server_pid=$!
          cleanup_server() { kill "$server_pid" >/dev/null 2>&1 || true; }
          trap cleanup_server EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/v1/ready >/dev/null || { cat /tmp/laidbackhr-next.log; exit 1; }
          LAIDBACKHR_BASE_URL=http://127.0.0.1:3000 pnpm test:live
          LAIDBACKHR_BASE_URL=http://127.0.0.1:3000 pnpm test:ai-redteam
          LAIDBACKHR_BASE_URL=http://127.0.0.1:3000 pnpm test:concurrency
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate reference model
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt -r backend/requirements-dev.txt
          cd backend
          PYTHONPATH=. python -m pytest -q
      - name: Validate Terraform
        run: |
          set -euo pipefail
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -q terraform.zip
          sudo install terraform /usr/local/bin/terraform
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Copy Azure AI configuration to the application vault
        env:
          AI_SEARCH_KEY: ${{ secrets.AI_SEARCH_KEY }}
          AI_SEARCH_ENDPOINT: ${{ secrets.AI_SEARCH_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_EMBEDDING_KEY: ${{ secrets.AZURE_EMBEDDING_KEY }}
          AZURE_EMBEDDING_ENDPOINT: ${{ secrets.AZURE_EMBEDDING_ENDPOINT }}
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-ai-search-key --value "$AI_SEARCH_KEY" --output none
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-ai-search-endpoint --value "$AI_SEARCH_ENDPOINT" --output none
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-openai-key --value "$AZURE_OPENAI_KEY" --output none
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-openai-endpoint --value "$AZURE_OPENAI_ENDPOINT" --output none
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-openai-embedding-key --value "$AZURE_EMBEDDING_KEY" --output none
          az keyvault secret set --vault-name "$APP_KEY_VAULT" --name azure-openai-embedding-endpoint --value "$AZURE_EMBEDDING_ENDPOINT" --output none
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/laidbackhr-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apply Azure infrastructure
        run: |
          set -euo pipefail
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -q terraform.zip
          sudo install terraform /usr/local/bin/terraform
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          export ARM_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          export ARM_SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          terraform -chdir=infra init -reconfigure -backend-config=environments/production/backend.hcl
          terraform -chdir=infra plan -var-file=environments/production/production.tfvars -var="image_tag=$IMAGE_TAG" -out=production.tfplan
          terraform -chdir=infra apply -auto-approve production.tfplan
      - name: Synchronize grounded HR knowledge
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          export AZURE_AI_SEARCH_API_KEY="$(az keyvault secret show --vault-name "$APP_KEY_VAULT" --name azure-ai-search-key --query value -o tsv)"
          export AZURE_AI_SEARCH_ENDPOINT="$(az keyvault secret show --vault-name "$APP_KEY_VAULT" --name azure-ai-search-endpoint --query value -o tsv)"
          export AZURE_OPENAI_EMBEDDING_API_KEY="$(az keyvault secret show --vault-name "$APP_KEY_VAULT" --name azure-openai-embedding-key --query value -o tsv)"
          export AZURE_OPENAI_EMBEDDING_ENDPOINT="$(az keyvault secret show --vault-name "$APP_KEY_VAULT" --name azure-openai-embedding-endpoint --query value -o tsv)"
          export AZURE_AI_SEARCH_INDEX="laidbackhr-knowledge-v1"
          pnpm ai:sync
      - name: Verify deployed services
        run: |
          set -euo pipefail
          wait_for_url() {
            local url="$1"
            local consecutive_ready=0
            for attempt in $(seq 1 30); do
              response="$(curl --fail --silent --show-error --max-time 20 "$url" || true)"
              if jq -e --arg version "$IMAGE_TAG" '.status == "ready" and .version == $version and .database.engine == "postgresql"' <<<"$response" >/dev/null; then
                consecutive_ready=$((consecutive_ready + 1))
                if [ "$consecutive_ready" -ge 3 ]; then return 0; fi
              else
                consecutive_ready=0
              fi
              sleep 10
            done
            echo "Health check failed: $url" >&2
            return 1
          }
          wait_for_url "https://$WEB_APP_NAME.azurewebsites.net/api/v1/ready"
