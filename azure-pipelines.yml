trigger:
  branches:
    include:
      - azure/migration

pr:
  branches:
    include:
      - azure/migration
      - main

variables:
  azureServiceConnection: laidbackhr-production-wif
  azureSubscriptionId: 7981312c-4577-455a-8bae-10269b74a97b
  resourceGroup: Laidback.ai
  acrName: laidbackhrf61hno
  acrLoginServer: laidbackhrf61hno.azurecr.io
  webAppName: laidbackhr-f61hno-web
  modelAppName: laidbackhr-f61hno-model
  terraformVersion: 1.15.8
  imageTag: $(Build.SourceVersion)

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Test
        displayName: Build and test
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            clean: true

          - task: UseNode@1
            displayName: Use Node.js 22
            inputs:
              version: 22.x
              checkLatest: false

          - script: |
              set -euo pipefail
              corepack enable
              pnpm install --frozen-lockfile
              pnpm lint
              pnpm build:azure
            displayName: Validate web application

          - task: UsePythonVersion@0
            displayName: Use Python 3.12
            inputs:
              versionSpec: 3.12

          - script: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check -r backend/requirements.txt -r backend/requirements-dev.txt
              cd backend
              PYTHONPATH=. python -m pytest -q
            displayName: Validate model service

          - script: |
              set -euo pipefail
              curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -q terraform.zip
              sudo install terraform /usr/local/bin/terraform
              terraform -chdir=infra init -backend=false
              terraform -chdir=infra fmt -check -recursive
              terraform -chdir=infra validate
            displayName: Validate Terraform

  - stage: Deploy
    displayName: Build and deploy
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Production
        displayName: Deploy production
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Build and push containers
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker build --pull --tag "$(acrLoginServer)/laidbackhr-web:$(imageTag)" .
                docker build --pull --file backend/Dockerfile --tag "$(acrLoginServer)/laidbackhr-model:$(imageTag)" backend
                docker push "$(acrLoginServer)/laidbackhr-web:$(imageTag)"
                docker push "$(acrLoginServer)/laidbackhr-model:$(imageTag)"

          - script: |
              set -euo pipefail
              curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -q terraform.zip
              sudo install terraform /usr/local/bin/terraform
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Apply deployment configuration
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(azureSubscriptionId)"
                terraform -chdir=infra init -reconfigure -backend-config=environments/production/backend.hcl
                terraform -chdir=infra plan \
                  -var-file=environments/production/terraform.tfvars.example \
                  -var="image_tag=$(imageTag)" \
                  -out=production.tfplan
                terraform -chdir=infra apply -auto-approve production.tfplan

          - script: |
              set -euo pipefail
              wait_for_url() {
                local url="$1"
                for attempt in $(seq 1 30); do
                  if curl --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
                    return 0
                  fi
                  sleep 10
                done
                echo "Health check failed: $url" >&2
                return 1
              }
              wait_for_url "https://$(modelAppName).azurewebsites.net/api/v1/health"
              wait_for_url "https://$(webAppName).azurewebsites.net/api/v1/health"
              wait_for_url "https://$(webAppName).azurewebsites.net/api/v1/ready"
            displayName: Verify deployed services
