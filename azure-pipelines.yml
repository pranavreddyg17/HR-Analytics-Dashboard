name: laidbackhr-validation-$(Date:yyyyMMdd).$(Rev:r)

# GitHub Actions is the single production deployment owner. Azure DevOps keeps
# an independently auditable validation record for the same mirrored main SHA;
# it never applies Terraform or races the production state lock.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22.x"
  pythonVersion: "3.12"
  terraformVersion: "1.15.8"

stages:
  - stage: Validate
    displayName: Validate mirrored source
    jobs:
      - job: Application
        displayName: Web, model, and infrastructure
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Use Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail
              corepack enable
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
            displayName: Configure pnpm

          - task: Cache@2
            displayName: Cache pnpm packages
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store

          - script: |
              set -euo pipefail
              corepack enable
              pnpm install --frozen-lockfile
              pnpm test:interactions
              docker run --detach --rm --name laidbackhr-test-postgres \
                --env POSTGRES_USER=postgres \
                --env POSTGRES_PASSWORD=postgres \
                --env POSTGRES_DB=laidbackhr_test \
                --publish 5432:5432 postgres:16
              cleanup_postgres() { docker stop laidbackhr-test-postgres >/dev/null 2>&1 || true; }
              trap cleanup_postgres EXIT
              for attempt in $(seq 1 30); do
                if docker exec laidbackhr-test-postgres pg_isready -U postgres -d laidbackhr_test >/dev/null 2>&1; then break; fi
                sleep 1
              done
              docker exec laidbackhr-test-postgres pg_isready -U postgres -d laidbackhr_test
              DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/laidbackhr_test' DATABASE_SSL_MODE=disable pnpm test:operations
              pnpm test:knowledge
              pnpm lint
              pnpm exec tsc --noEmit
              pnpm build:azure
              export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/laidbackhr_test'
              export DATABASE_SSL_MODE=disable
              export LOCAL_UI_PREVIEW=true
              export BOOTSTRAP_ADMIN_EMAIL='local-admin@laidbackhr.ai'
              export BOOTSTRAP_ADMIN_NAME='CI administrator'
              export APP_VERSION=ci-smoke
              export PORT=3000
              pnpm start > /tmp/laidbackhr-next.log 2>&1 &
              server_pid=$!
              cleanup_services() {
                kill "${server_pid:-}" >/dev/null 2>&1 || true
                docker stop laidbackhr-test-postgres >/dev/null 2>&1 || true
              }
              trap cleanup_services EXIT
              for attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:3000/api/v1/ready >/dev/null; then break; fi
                sleep 1
              done
              curl --fail --silent http://127.0.0.1:3000/api/v1/ready >/dev/null || { cat /tmp/laidbackhr-next.log; exit 1; }
              LAIDBACKHR_BASE_URL=http://127.0.0.1:3000 pnpm test:live
            displayName: Validate web application

          - task: UsePythonVersion@0
            displayName: Use Python
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check -r backend/requirements.txt -r backend/requirements-dev.txt
              cd backend
              PYTHONPATH=. python -m pytest -q
            displayName: Validate reference model

          - script: |
              set -euo pipefail
              curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -q terraform.zip
              sudo install terraform /usr/local/bin/terraform
              terraform -chdir=infra init -backend=false
              terraform -chdir=infra fmt -check -recursive
              terraform -chdir=infra validate
            displayName: Validate Terraform

  - stage: DeploymentEvidence
    displayName: Verify production evidence
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Readiness
        displayName: Confirm the mirrored SHA is deployed
        steps:
          - script: |
              set -euo pipefail
              for attempt in $(seq 1 60); do
                response="$(curl --silent --show-error --max-time 30 https://www.laidbackhr.cloud/api/v1/ready || true)"
                if jq -e --arg version "$(Build.SourceVersion)" '
                  .status == "ready"
                  and .version == $version
                  and .database.engine == "postgresql"
                ' <<<"$response" >/dev/null 2>&1; then
                  echo "Production is ready at mirrored commit $(Build.SourceVersion)."
                  exit 0
                fi
                sleep 15
              done
              echo "Production did not report mirrored commit $(Build.SourceVersion) within 15 minutes." >&2
              exit 1
            displayName: Verify production readiness
